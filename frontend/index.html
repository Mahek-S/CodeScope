<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeScope</title>
    <script>
      // Applied before React mounts so there's no flash of the wrong theme.
      (function () {
        var stored = localStorage.getItem("codescope-theme");
        document.documentElement.classList.add(stored === "light" ? "light" : "dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
